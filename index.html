        }

        /* ---- Đánh dấu nước đi gần nhất ----
         * Máy (ĐEN) vừa đi (turn === RED): đường đi màu xanh dương nổi bật + mũi tên + nhấp nháy.
         * Người chơi vừa đi: giữ dấu xanh lá nhẹ như cũ. */
        const MACHINE_BLUE = '#1d4ed8';
        const PULSE_MS = 800;
        let pulseStart = -1e9;
        let pulseRAF = 0;

        function startPulse() { /* không còn hiệu ứng nhấp nháy */ }

        // Dấu nước đi gần nhất: giống nhau cho người chơi, đối thủ và đánh 2 người
        function drawLastMoveUnder() {
            if (!lastMove) return;
            const f = getXY(lastMove.fromR, lastMove.fromC);
            const t = getXY(lastMove.toR, lastMove.toC);
            ctx.save();
            ctx.strokeStyle = 'rgba(29, 78, 216, 0.85)';
            ctx.lineWidth = 4;
            ctx.setLineDash([7, 5]);
            ctx.beginPath();
            ctx.moveTo(f.x, f.y);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = 'rgba(37, 99, 235, 0.30)';
            ctx.beginPath();
            ctx.arc(f.x, f.y, cellSize * 0.42, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = MACHINE_BLUE;
            ctx.beginPath();
            ctx.arc(f.x, f.y, cellSize * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Vòng quanh quân vừa đến (vẽ đè lên quân để luôn thấy rõ)
        function drawMachineMoveOver() {
            if (!lastMove) return;
            const t = getXY(lastMove.toR, lastMove.toC);
            ctx.save();
            ctx.strokeStyle = MACHINE_BLUE;
            ctx.lineWidth = 3.6;
            ctx.beginPath();
            ctx.arc(t.x, t.y, cellSize * 0.47, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
        }

        function drawBoard() {
            const w = cellSize * 8 + padX * 2;
            const h = cellSize * 9 + padY * 2;

            // Warm Wooden Board Surface
            ctx.fillStyle = '#f2ce94';
            ctx.fillRect(0, 0, w, h);

            // Outer thick border
            ctx.strokeStyle = '#2b1402';
            ctx.lineWidth = 4;
            ctx.strokeRect(padX - 5, padY - 5, cellSize * 8 + 10, cellSize * 9 + 10);

            // River Band
            ctx.fillStyle = '#e4b773';
            ctx.fillRect(padX, padY + 4 * cellSize, cellSize * 8, cellSize);

            // Grid Lines
            ctx.strokeStyle = '#2b1402';
            ctx.lineWidth = 2.6;

            for (let r = 0; r < 10; r++) {
                ctx.beginPath();
                ctx.moveTo(padX, padY + r * cellSize);
                ctx.lineTo(padX + 8 * cellSize, padY + r * cellSize);
                ctx.stroke();
            }

            for (let c = 0; c < 9; c++) {
                const x = padX + c * cellSize;
                if (c === 0 || c === 8) {
                    ctx.beginPath();
                    ctx.moveTo(x, padY);
                    ctx.lineTo(x, padY + 9 * cellSize);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(x, padY);
                    ctx.lineTo(x, padY + 4 * cellSize);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, padY + 5 * cellSize);
                    ctx.lineTo(x, padY + 9 * cellSize);
                    ctx.stroke();
                }
            }

            // Palace Diagonals
            ctx.beginPath();
            ctx.moveTo(padX + 3 * cellSize, padY);
            ctx.lineTo(padX + 5 * cellSize, padY + 2 * cellSize);
            ctx.moveTo(padX + 5 * cellSize, padY);
            ctx.lineTo(padX + 3 * cellSize, padY + 2 * cellSize);
            ctx.moveTo(padX + 3 * cellSize, padY + 7 * cellSize);
            ctx.lineTo(padX + 5 * cellSize, padY + 9 * cellSize);
            ctx.moveTo(padX + 5 * cellSize, padY + 7 * cellSize);
            ctx.lineTo(padX + 3 * cellSize, padY + 9 * cellSize);
            ctx.stroke();

            // Position crosses
            const ms = Math.max(4, cellSize * 0.13);
            const mg = Math.max(3, cellSize * 0.08);
            const marks = [
                [2,1],[2,7],[7,1],[7,7],
                [3,0],[3,2],[3,4],[3,6],[3,8],
                [6,0],[6,2],[6,4],[6,6],[6,8]
            ];
            for (const [r, c] of marks) {
                const { x, y } = getXY(r, c);
                drawCornerMark(x, y, ms, mg, c > 0, c < 8);
            }

            // River Labels
            ctx.save();
            ctx.fillStyle = '#4a2508';
            ctx.font = `800 ${Math.round(cellSize * 0.35)}px "Be Vietnam Pro", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SỞ HÀ', padX + 2 * cellSize, padY + 4.5 * cellSize);
            ctx.fillText('HÁN GIỚI', padX + 6 * cellSize, padY + 4.5 * cellSize);
            ctx.restore();

            drawLastMoveUnder();

            // Selected Piece Ring
            if (selected) {
                const pos = getXY(selected.r, selected.c);
                ctx.save();
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, cellSize * 0.50, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // Draw All Pieces
            for (let r = 0; r < 10; r++) {
                for (let c = 0; c < 9; c++) {
                    if (board[r][c]) drawPiece(r, c, board[r][c]);
                }
            }

            drawMachineMoveOver();

            // Valid Move Dots / Capture Rings
            for (const m of validMoves) {
                const pos = getXY(m.r, m.c);
                const hasEnemy = board[m.r][m.c] !== null;
                ctx.save();
                if (hasEnemy) {
                    ctx.strokeStyle = '#22c55e';
                    ctx.lineWidth = 5.5;
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, cellSize * 0.48, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#16a34a';
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, cellSize * 0.22, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        function drawPiece(r, c, piece) {
            const { x, y } = getXY(r, c);
            drawPieceOn(ctx, x, y, cellSize * 0.465, piece);
        }

        // Vẽ 1 quân lên canvas bất kỳ (dùng chung cho quân trên bàn và quân bị ăn => giống hệt nhau)
        function drawPieceOn(ctx, x, y, rad, piece) {
            const isRed = piece.color === RED;

            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.55)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 3;

            if (piece.isHidden) {
                /* -------------------------------------------------------------
                 * HIDDEN PIECE (Quân Úp): Refined 3D Mahogany Wood vs Dark Slate Stone
                 * Completely blank face, pleasant natural tones
                 * ------------------------------------------------------------- */
                // Outer 3D Bevel Rim
                const rimGrad = ctx.createLinearGradient(x - rad, y - rad, x + rad, y + rad);
                if (isRed) {
                    // Warm amber-mahogany rim
                    rimGrad.addColorStop(0, '#fdba74');
                    rimGrad.addColorStop(0.5, '#b45309');
                    rimGrad.addColorStop(1, '#451a03');
                } else {
                    // Refined slate-stone rim
                    rimGrad.addColorStop(0, '#cbd5e1');
                    rimGrad.addColorStop(0.5, '#475569');
                    rimGrad.addColorStop(1, '#0f172a');
                }

                ctx.fillStyle = rimGrad;
                ctx.beginPath();
                ctx.arc(x, y, rad, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = 'transparent';

                // Smooth Domed Top Surface
                const innerR = rad * 0.90;
                const domeGrad = ctx.createRadialGradient(
                    x - innerR * 0.3,
                    y - innerR * 0.3,
                    innerR * 0.05,
                    x,
                    y,
                    innerR
                );

                if (isRed) {
                    // Warm terracotta / mahogany wood (#c2410c -> #7c2d12)
                    domeGrad.addColorStop(0, '#ea580c');
                    domeGrad.addColorStop(0.35, '#c2410c');
                    domeGrad.addColorStop(0.85, '#7c2d12');
                    domeGrad.addColorStop(1, '#431407');
                } else {
                    // Dark slate / charcoal-jade stone (#475569 -> #1e293b)
                    domeGrad.addColorStop(0, '#64748b');
                    domeGrad.addColorStop(0.35, '#334155');
                    domeGrad.addColorStop(0.85, '#1e293b');
                    domeGrad.addColorStop(1, '#0f172a');
                }

                ctx.fillStyle = domeGrad;
                ctx.beginPath();
                ctx.arc(x, y, innerR, 0, Math.PI * 2);
                ctx.fill();

                // Soft Specular Highlight Arc
                ctx.strokeStyle = isRed ? 'rgba(255, 237, 213, 0.32)' : 'rgba(241, 245, 249, 0.28)';
                ctx.lineWidth = Math.max(1.5, rad * 0.055);
                ctx.beginPath();
                ctx.arc(x, y, rad * 0.76, Math.PI * 1.15, Math.PI * 1.68);
                ctx.stroke();

                // Outer crisp definition ring
                ctx.strokeStyle = isRed ? '#431407' : '#090d16';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.arc(x, y, rad, 0, Math.PI * 2);
                ctx.stroke();

            } else {
                /* -------------------------------------------------------------
                 * REVEALED PIECE (Quân Ngửa): Cream Ivory Disc, NO Inner Border,
                 * Huge Traditional Han Character Filling the Piece
                 * ------------------------------------------------------------- */
                const faceGrad = ctx.createRadialGradient(
                    x - rad * 0.22,
                    y - rad * 0.22,
                    rad * 0.1,
                    x,
                    y,
                    rad
                );
                faceGrad.addColorStop(0, '#fffef8');
                faceGrad.addColorStop(1, '#f3d79b');

                ctx.fillStyle = faceGrad;
                ctx.beginPath();
                ctx.arc(x, y, rad, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = 'transparent';

                // Outer edge only (no inner circle)
                ctx.strokeStyle = isRed ? '#991b1b' : '#1e293b';
                ctx.lineWidth = 3;
                ctx.stroke();

                const info = PIECE_DATA[piece.trueType];
                const char = isRed ? info.rHan : info.bHan;

                ctx.fillStyle = isRed ? '#b91c1c' : '#111827';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `900 ${Math.round(rad * 1.36)}px "Noto Serif", "KaiTi", "STKaiti", serif`;
                ctx.fillText(char, x, y + rad * 0.05);
            }

            ctx.restore();
        }

        /* =============================================================
         * 6. INPUT HANDLING & UI UPDATES
         * ============================================================= */
        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameOver || aiBusy || (mode === 'ai' && turn !== RED)) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const c = Math.round((x - padX) / cellSize);
            const r = Math.round((y - padY) / cellSize);
            if (!inBounds(r, c)) return;

            const pos = getXY(r, c);
            if (Math.hypot(x - pos.x, y - pos.y) > cellSize * 0.58) return;

            const targetMove = validMoves.find(m => m.r === r && m.c === c);
            if (selected && targetMove) {
                makeMove(selected.r, selected.c, r, c);
                return;
            }

            const clicked = board[r][c];
            if (clicked && clicked.color === turn) {
                selected = { r, c };
                validMoves = getLegalMoves(board, r, c);
                playTone('select');
                drawBoard();
            } else {
                selected = null;
                validMoves = [];
                drawBoard();
            }
        });

        function updateStatusUI() {
            const turnText = document.getElementById('turnText');
            const checkBadge = document.getElementById('checkBadge');
            const btnUndo = document.getElementById('btnUndo');

            btnUndo.disabled = historyStack.length === 0 || aiBusy;

            const base = 'font-extrabold text-[clamp(1rem,2.3vw,1.4rem)] flex items-center gap-2 ';
            if (mode === 'pvp') {
                if (turn === RED) {
                    turnText.className = base + 'text-red-400';
                    turnText.innerHTML = `<span class="w-3.5 h-3.5 rounded-full bg-red-500 inline-block animate-pulse"></span><span>Lượt quân ĐỎ</span>`;
                } else {
                    turnText.className = base + 'text-slate-300';
                    turnText.innerHTML = `<span class="w-3.5 h-3.5 rounded-full bg-slate-400 inline-block animate-pulse"></span><span>Lượt quân ĐEN</span>`;
                }
            } else if (turn === RED) {
                turnText.className = base + 'text-red-400';
                turnText.innerHTML = `<span class="w-3.5 h-3.5 rounded-full bg-red-500 inline-block animate-pulse"></span><span>Lượt của bạn (ĐỎ)</span>`;
            } else {
                turnText.className = base + 'text-slate-300';
                turnText.innerHTML = `<span class="w-3.5 h-3.5 rounded-full bg-slate-400 inline-block animate-ping"></span><span>Máy đang suy nghĩ...</span>`;
            }

            const inChk = isInCheck(board, turn);
            checkBadge.classList.toggle('hidden', !inChk);

            const styleBtn = document.getElementById('aiStyleBtn');
            styleBtn.textContent = 'Máy: ' + aiStyleLabel();
            styleBtn.classList.toggle('hidden', mode !== 'ai');
            styleBtn.classList.toggle('invisible', inChk); // chiếu tướng thì đè lên phần này

            renderTrays();
            requestAnimationFrame(resizeBoard);
        }

        const CAPTURED_SCALE = 0.8; // quân bị ăn = 80% quân trên bàn

        function renderTray(arr, elId) {
            const el = document.getElementById(elId);
            el.innerHTML = '';
            const rad = cellSize * 0.465 * CAPTURED_SCALE;
            const size = Math.ceil(rad * 2 + 12);   // chừa chỗ cho bóng đổ
            const dpr = window.devicePixelRatio || 1;
            for (const p of arr) {
                const cv = document.createElement('canvas');
                cv.width = Math.round(size * dpr);
                cv.height = Math.round(size * dpr);
                cv.style.width = size + 'px';
                cv.style.height = size + 'px';
                cv.style.margin = '-5px';
                const c2 = cv.getContext('2d');
                c2.setTransform(dpr, 0, 0, dpr, 0, 0);
                // Quân bị ăn luôn hiện mặt ngửa
                drawPieceOn(c2, size / 2, size / 2 - 1, rad, { ...p, isHidden: false });
                el.appendChild(cv);
            }
        }

        function renderTrays() {
            renderTray(capturedByRed, 'redCapturedList');
            renderTray(capturedByBlack, 'blackCapturedList');
        }

        function showGameOver(winner) {
            recordResult(winner);
            const modal = document.getElementById('gameOverModal');
            const icon = document.getElementById('modalIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');

            if (mode === 'pvp') {
                icon.textContent = '🏆';
                title.textContent = winner === RED ? 'ĐỎ THẮNG!' : 'ĐEN THẮNG!';
                desc.textContent = winner === RED ? 'Bên quân Đỏ đã thắng ván cờ này!' : 'Bên quân Đen đã thắng ván cờ này!';
            } else if (winner === RED) {
                icon.textContent = '🏆';
                title.textContent = 'CHIẾN THẮNG!';
                desc.textContent = 'Chúc mừng bác đã thắng ván cờ này!';
            } else {
                icon.textContent = '🍵';
                title.textContent = 'VÁN CỜ KẾT THÚC';
                desc.textContent = 'Máy đã thắng. Bác có thể bấm Đi Lại hoặc chơi Ván Mới!';
            }
            modal.classList.remove('hidden');
        }

        function closeGameOverAndUndo() {
            document.getElementById('gameOverModal').classList.add('hidden');
            undoMove();
        }

        async function shareLink() {
            const url = location.href.split('#')[0];
            const data = { title: 'Cờ Tướng Úp', text: 'Chơi cờ tướng cờ úp cùng mình nhé!', url };
            try {
                if (navigator.share) {
                    await navigator.share(data);
                    return;
                }
            } catch (e) {
                if (e && e.name === 'AbortError') return; // người dùng tự đóng bảng chia sẻ
            }
            try {
                await navigator.clipboard.writeText(url);
                showToast('Đã sao chép link');
            } catch (e) {
                window.prompt('Sao chép link này để chia sẻ:', url);
            }
        }

        function openSettings() {
            renderHistory();
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        let pendingConfirm = null;

        function askConfirm(title, desc, action) {
            pendingConfirm = action;
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmDesc').textContent = desc;
            document.getElementById('confirmModal').classList.remove('hidden');
        }

        function confirmYes() {
            const act = pendingConfirm || startNewGame;
            closeConfirmModal();
            act();
        }

        function openConfirmModal() {
            if (historyStack.length === 0 || gameOver) startNewGame();
            else askConfirm('CHƠI VÁN MỚI?', 'Xếp lại bàn cờ và bắt đầu ván mới từ đầu?', startNewGame);
        }

        function closeConfirmModal() {
            pendingConfirm = null;
            document.getElementById('confirmModal').classList.add('hidden');
        }

        window.onload = () => {
            loadSettings();
            applyModeUI();
            applyVariantUI();
            applySoundUI();
            resizeBoard();
            // Trình duyệt di động hay đổi cỡ khung sau khi tải xong (thanh địa chỉ): tính lại để bàn luôn giữa màn hình
            setTimeout(resizeBoard, 150);
            setTimeout(resizeBoard, 700);
            rollAiStyle();
            if (!loadSavedGameState()) {
                startNewGame();
            }
        };
    </script>
